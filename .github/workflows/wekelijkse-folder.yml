name: Wekelijkse aanbiedingenfolder

on:
  # 07:00 UTC op maandag = 08:00 Nederlandse wintertijd / 09:00 zomertijd.
  # Pas de "7" hieronder aan als je 'm op een ander tijdstip wilt (GitHub cron is altijd UTC).
  schedule:
    - cron: "0 7 * * 1"
  # Hiermee kun je de run ook handmatig starten via de "Actions"-tab op GitHub, om te testen.
  workflow_dispatch: {}

jobs:
  verstuur-folder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run run-now
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
